<path class="node" d="M 1370 900 H 1610 V 970 H 1370 Z"/>
<text class="nodeText" x="1490" y="935">后端启动训练进程</text>
<path class="node" d="M 1250 1000 H 1730 V 1070 H 1250 Z"/>
