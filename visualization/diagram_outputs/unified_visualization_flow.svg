<path class="node" d="M 1240 1100 H 1740 V 1170 H 1240 Z"/>
<text class="nodeText" x="1490" y="1135">后端检测训练指标变化并生成训练曲线</text>
<path class="node" d="M 1290 1200 H 1690 V 1270 H 1290 Z"/>
<text class="nodeText" x="1490" y="1235">SSE推送训练状态与可视化结果</text>
<path class="node" d="M 1300 1300 H 1680 V 1370 H 1300 Z"/>
<text class="nodeText" x="1490" y="1335">前端刷新日志、摘要与训练指标图</text>
<path class="node" d="M 1490 1400 L 1610 1445 L 1490 1490 L 1370 1445 Z"/>
<text class="nodeText" x="1490" y="1445">任务是否结束</text>
<path class="node" d="M 1330 1530 H 1650 V 1600 H 1330 Z"/>
<text class="nodeText" x="1490" y="1565">展示训练结果与运行摘要</text>
<path class="node" d="M 1490 1630 L 1610 1675 L 1490 1720 L 1370 1675 Z"/>
<text class="nodeText" x="1490" y="1675">继续操作</text>
<path class="node" d="M 1880.0 600 H 2080.0 A 30.0 30.0 0 0 1 2080.0 660 H 1880.0 A 30.0 30.0 0 0 1 1880.0 600 Z"/>
