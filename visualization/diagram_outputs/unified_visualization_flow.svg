<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2050" viewBox="0 0 2400 2050">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
</marker>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}
.title{font-size:22px;font-weight:700}
.node{fill:#ffffff;stroke:#334155;stroke-width:2}
.line{fill:none;stroke:#4b5563;stroke-width:2.2;marker-end:url(#arrow)}
.label{font-size:15px;fill:#374151}
.nodeText{font-size:16px;font-weight:500;text-anchor:middle;dominant-baseline:middle}
</style>
</defs>
<rect x="0" y="0" width="2400" height="2050" fill="#f8fafc"/>
<text x="1200" y="28" class="title" text-anchor="middle">统一Web可视化系统操作流程图</text>
<path class="node" d="M 1040.0 40 H 1160.0 A 30.0 30.0 0 0 1 1160.0 100 H 1040.0 A 30.0 30.0 0 0 1 1040.0 40 Z"/>
<text class="nodeText" x="1100" y="70">开始</text>
<path class="node" d="M 980 140 H 1220 V 210 H 980 Z"/>
<text class="nodeText" x="1100" y="175">启动HTTP服务</text>
<path class="node" d="M 920 250 H 1280 V 320 H 920 Z"/>
<text class="nodeText" x="1100" y="285">进入统一Web可视化界面</text>
<path class="node" d="M 1100 360 L 1190 405 L 1100 450 L 1010 405 Z"/>
<text class="nodeText" x="1100" y="405">选择页面</text>
<path class="node" d="M 250 360 H 510 V 430 H 250 Z"/>
<text class="nodeText" x="380" y="395">进入部署可视化页面</text>
<path class="node" d="M 250 470 H 510 V 540 H 250 Z"/>
<text class="nodeText" x="380" y="505">选择地图与需求文件</text>
<path class="node" d="M 250 570 H 510 V 640 H 250 Z"/>
<text class="nodeText" x="380" y="605">执行需求结构化预览</text>
<path class="node" d="M 180 670 H 580 V 740 H 180 Z"/>
<text class="nodeText" x="380" y="705">配置规划器、代理模型与搜索参数</text>
<path class="node" d="M 250 770 H 510 V 840 H 250 Z"/>
<text class="nodeText" x="380" y="805">启动闭环部署任务</text>
<path class="node" d="M 180 870 H 580 V 940 H 180 Z"/>
<text class="nodeText" x="380" y="905">后端构建命令并启动决策进程</text>
<path class="node" d="M 170 970 H 590 V 1040 H 170 Z"/>
<text class="nodeText" x="380" y="1005">决策进程持续写入trajectory.json</text>
<path class="node" d="M 180 1070 H 580 V 1140 H 180 Z"/>
<text class="nodeText" x="380" y="1105">后端轮询轨迹并解析当前状态</text>
<path class="node" d="M 120 1170 H 640 V 1240 H 120 Z"/>
<text class="nodeText" x="380" y="1205">渲染RoI覆盖率图、部署效果图与指标趋势图</text>
<path class="node" d="M 250 1270 H 510 V 1340 H 250 Z"/>
<text class="nodeText" x="380" y="1305">SSE推送状态到前端</text>
<path class="node" d="M 180 1370 H 580 V 1440 H 180 Z"/>
<text class="nodeText" x="380" y="1405">前端刷新流程状态、图像、表格与日志</text>
<path class="node" d="M 380 1470 L 510 1515 L 380 1560 L 250 1515 Z"/>
<text class="nodeText" x="380" y="1515">任务是否结束</text>
<path class="node" d="M 250 1600 H 510 V 1670 H 250 Z"/>
<text class="nodeText" x="380" y="1635">展示最终部署结果</text>
<path class="node" d="M 380 1700 L 510 1745 L 380 1790 L 250 1745 Z"/>
<text class="nodeText" x="380" y="1745">继续操作</text>
<path class="node" d="M 1500 360 H 1800 V 430 H 1500 Z"/>
<text class="nodeText" x="1650" y="395">进入代理模型可视化页面</text>
<path class="node" d="M 1650 470 L 1740 515 L 1650 560 L 1560 515 Z"/>
<text class="nodeText" x="1650" y="515">选择模式</text>
<path class="node" d="M 1400.0 600 H 1580.0 A 30.0 30.0 0 0 1 1580.0 660 H 1400.0 A 30.0 30.0 0 0 1 1400.0 600 Z"/>
<text class="nodeText" x="1490" y="630">预训练模式</text>
<path class="node" d="M 1270 700 H 1710 V 770 H 1270 Z"/>
