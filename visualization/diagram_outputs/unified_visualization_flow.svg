<path class="node" d="M 1840 700 H 2120 V 770 H 1840 Z"/>
<text class="nodeText" x="1980" y="724">填写Checkpoint输出目</text>
<text class="nodeText" x="1980" y="746">录</text>
<path class="node" d="M 1840 800 H 2120 V 870 H 1840 Z"/>
<text class="nodeText" x="1980" y="835">检测测试集并绑定样本</text>
<path class="node" d="M 1840 900 H 2120 V 970 H 1840 Z"/>
<text class="nodeText" x="1980" y="935">选择测试样本</text>
<path class="node" d="M 1810 1000 H 2150 V 1070 H 1810 Z"/>
<text class="nodeText" x="1980" y="1035">添加一个或多个Checkpoint</text>
<path class="node" d="M 1840 1100 H 2120 V 1170 H 1840 Z"/>
<text class="nodeText" x="1980" y="1135">启动单样本多模型评测</text>
<path class="node" d="M 1820 1200 H 2140 V 1270 H 1820 Z"/>
<text class="nodeText" x="1980" y="1235">后端执行多Checkpoint预测</text>
<path class="node" d="M 1760 1300 H 2200 V 1370 H 1760 Z"/>
<text class="nodeText" x="1980" y="1335">生成预测对比图及RMSE、MAE、R2指标</text>
<path class="node" d="M 1840 1400 H 2120 V 1470 H 1840 Z"/>
<text class="nodeText" x="1980" y="1435">SSE推送评测状态与结果</text>
<path class="node" d="M 1770 1500 H 2190 V 1570 H 1770 Z"/>
<text class="nodeText" x="1980" y="1535">前端刷新对比图、指标表与模型列表</text>
<path class="node" d="M 1980 1600 L 2120 1645 L 1980 1690 L 1840 1645 Z"/>
<text class="nodeText" x="1980" y="1645">任务是否结束</text>
<path class="node" d="M 1780 1730 H 2180 V 1800 H 1780 Z"/>
<text class="nodeText" x="1980" y="1765">展示评测结果与模型对比结论</text>
<path class="node" d="M 1980 1830 L 2120 1875 L 1980 1920 L 1840 1875 Z"/>
<text class="nodeText" x="1980" y="1875">继续操作</text>
<path class="node" d="M 1040.0 1945 H 1160.0 A 30.0 30.0 0 0 1 1160.0 2005 H 1040.0 A 30.0 30.0 0 0 1 1040.0 1945 Z"/>
